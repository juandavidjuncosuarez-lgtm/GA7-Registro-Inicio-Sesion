
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de autenticación</title>
</head>
<body>

    <h1>Sistema de autenticación</h1>
    <p>Regístrate o inicia sesión para continuar.</p>

    <!-- Formulario para registrar un usuario -->
    <section>
        <h2>Crear cuenta</h2>

        <form id="formRegistro">
            <label for="usuarioRegistro">Nombre de usuario:</label>
            <input type="text" id="usuarioRegistro" name="usuario" required>

            <br><br>

            <label for="contrasenaRegistro">Contraseña:</label>
            <input type="password" id="contrasenaRegistro" name="contrasena" required>

            <br><br>

            <button type="submit">Registrarme</button>
        </form>

        <p id="mensajeRegistro" role="status"></p>
    </section>

    <hr>

    <!-- Formulario para iniciar sesión -->
    <section>
        <h2>Iniciar sesión</h2>

        <form id="formLogin">
            <label for="usuarioLogin">Nombre de usuario:</label>
            <input type="text" id="usuarioLogin" name="usuario" required>

            <br><br>

            <label for="contrasenaLogin">Contraseña:</label>
            <input type="password" id="contrasenaLogin" name="contrasena" required>

            <br><br>

            <button type="submit">Iniciar sesión</button>
        </form>

        <p id="mensajeLogin" role="status"></p>
    </section>
<script src="/app.js"></script>
</body>
</html>
